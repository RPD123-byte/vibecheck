<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Highlight & React renderer fixture</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      body { max-width: 760px; margin: 60px auto; padding: 0 24px; background: Canvas; color: CanvasText; }
      h1 { font-size: 22px; }
      [data-user-message-bubble] {
        width: fit-content;
        max-width: 540px;
        margin-top: 48px;
        padding: 14px 18px;
        border-radius: 18px;
        background: color-mix(in srgb, #087eff 76%, Canvas);
        color: white;
      }
      .assistant-message { max-width: 620px; margin-top: 38px; }
      .element-target {
        display: flex;
        width: 260px;
        margin-top: 54px;
        padding: 16px;
        align-items: center;
        gap: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 14px;
        background: color-mix(in srgb, Canvas 90%, CanvasText 10%);
        color: CanvasText;
      }
      .element-target svg { width: 28px; height: 28px; flex: none; }
      .outside { margin-top: 100px; padding: 30px; border: 1px dashed GrayText; }
      #paper-fixture-canvas {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 5;
        width: 260px;
        height: 150px;
        border: 1px solid #5e5ce6;
        border-radius: 10px;
        background: #25252a;
      }
    </style>
  </head>
  <body>
    <h1>Codex renderer fixture</h1>
    <p>Select text and press Control–Option–R.</p>
    <article data-user-message-bubble>
      <span id="fixture-text">Highlight this sentence and choose a reaction.</span>
    </article>
    <main class="assistant-message">
      <p><span id="assistant-text">Assistant text uses the content-block fallback.</span></p>
    </main>
    <button class="element-target" id="fixture-element-target" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="#0a84ff"/>
      </svg>
      Inspect this whole component
    </button>
    <aside id="generic-app-surface">
      <p id="generic-text-target">
        Generic Electron text with <strong>nested inline markup</strong>.
      </p>
    </aside>
    <div class="outside" id="outside">Clicking here dismisses the highlight and reaction bar.</div>
    <div data-paper-editor id="paper-fixture-editor">
      <canvas
        aria-hidden="true"
        id="paper-fixture-canvas"
        width="520"
        height="300"
      ></canvas>
    </div>
    <script>
      const paperFixtureEditor = document.getElementById('paper-fixture-editor');
      const paperFixtureCanvas = document.getElementById('paper-fixture-canvas');
      const paperFixtureNode = {
        id: 'paper-card-1',
        label: 'Paper canvas card',
        component: 'Frame',
        get bounds() {
          const rect = paperFixtureCanvas.getBoundingClientRect();
          return {
            minX: rect.left + 24,
            minY: rect.top + 20,
            maxX: rect.right - 24,
            maxY: rect.bottom - 20,
          };
        },
      };
      const paperFixtureState = {
        fileDataId: 'fixture-file',
        cameraState: {
          viewportToWorld(point) {
            return point;
          },
          worldToViewportRect(bounds) {
            return bounds;
          },
        },
        pointerState: {
          includeLockedNodesInHover: false,
          calculateNodeAtPoint(point) {
            const bounds = paperFixtureNode.bounds;
            const contains = point.x >= bounds.minX
              && point.x <= bounds.maxX
              && point.y >= bounds.minY
              && point.y <= bounds.maxY;
            return contains
              ? { node: paperFixtureNode, deepestNode: paperFixtureNode, location: 'body' }
              : { node: null, deepestNode: null, location: null };
          },
        },
      };
      Object.defineProperty(paperFixtureEditor, '__reactFiber$fixture', {
        value: {
          memoizedProps: { editorState: paperFixtureState },
          return: null,
        },
      });
    </script>
  </body>
</html>
