<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Highlight & React browser CDP fixture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 48px;
        background: #0f1220;
        color: #f7f8ff;
      }

      main {
        display: grid;
        max-width: 980px;
        margin: 0 auto;
        gap: 24px;
      }

      .card {
        padding: 24px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 18px;
        background: #1b2035;
        box-shadow: 0 18px 48px rgb(0 0 0 / 24%);
      }

      #component-target {
        display: grid;
        gap: 12px;
      }

      #component-target button {
        width: fit-content;
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        background: #8e7dff;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      .frame-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      iframe {
        width: 100%;
        height: 150px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 12px;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>Browser ownership experiment</p>
        <h1 id="fixture-heading">
          A normal website still exposes renderer content
        </h1>
      </header>

      <article id="component-target" class="card">
        <h2>Selectable browser component</h2>
        <p id="selection-target">
          This exact sentence can be selected through the browser Range API.
        </p>
        <button id="action-button" type="button">Underlying action</button>
      </article>

      <section class="card">
        <h2>Shadow DOM probes</h2>
        <open-shadow-card id="open-shadow"></open-shadow-card>
        <closed-shadow-card id="closed-shadow"></closed-shadow-card>
      </section>

      <section class="card">
        <h2>Frame probes</h2>
        <div class="frame-grid">
          <iframe id="same-origin-frame" src="/frame.html"></iframe>
          <iframe id="cross-origin-frame" title="Cross-origin frame"></iframe>
        </div>
      </section>
    </main>

    <script>
      class OpenShadowCard extends HTMLElement {
        connectedCallback() {
          if (this.shadowRoot) return;
          const root = this.attachShadow({ mode: "open" });
          const paragraph = document.createElement("p");
          paragraph.id = "open-shadow-text";
          paragraph.textContent = "Open shadow component text";
          root.append(paragraph);
        }
      }

      class ClosedShadowCard extends HTMLElement {
        connectedCallback() {
          if (this.dataset.ready) return;
          this.dataset.ready = "true";
          const root = this.attachShadow({ mode: "closed" });
          const paragraph = document.createElement("p");
          paragraph.id = "closed-shadow-text";
          paragraph.textContent = "Closed shadow component text";
          root.append(paragraph);
        }
      }

      customElements.define("open-shadow-card", OpenShadowCard);
      customElements.define("closed-shadow-card", ClosedShadowCard);
      document.getElementById("cross-origin-frame").src =
        new URLSearchParams(location.search).get("crossOrigin") || "/frame.html";
      window.__underlyingActivations = 0;
      document.getElementById("action-button").addEventListener("click", () => {
        window.__underlyingActivations += 1;
      });
    </script>
  </body>
</html>
