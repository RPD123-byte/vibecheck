[package]
name = "highlight-context-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
codex-control = { git = "https://github.com/RPD123-byte/CodexWarden.git", tag = "v0.1.0", version = "=0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
transport = { git = "https://github.com/RPD123-byte/CodexWarden.git", tag = "v0.1.0", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
