[package]
name = "vibecheck-expression-interruption"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
codex-control = { git = "https://github.com/RPD123-byte/CodexWarden.git", tag = "v0.1.0", version = "=0.1.0" }
nix = { version = "0.30", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
