name: CI

on:
  push:
  pull_request:

jobs:
  clean-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Assert prototypes are absent
        run: |
          test ! -e experimentation
          test ! -e emotiefflib_repo

      - name: Install declared Python dependencies
        run: python -m pip install --upgrade build && python -m pip install -e '.[test]'

      - name: Lint and test Python
        run: |
          ruff check src tests
          ruff format --check src tests
          pytest

      - name: Build Python artifacts
        run: python -m build

      - name: Validate Electron application
        run: |
          npm ci
          npm run js:format:check
          npm run js:typecheck
          npm run js:test
          npm run js:audit

      - name: Lint, test, and build Rust
        run: |
          cargo fmt --manifest-path src/native/expression_interruption/Cargo.toml -- --check
          cargo clippy --manifest-path src/native/expression_interruption/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src/native/expression_interruption/Cargo.toml
          cargo build --locked --release --manifest-path src/native/expression_interruption/Cargo.toml

      - name: Verify production artifacts exclude prototypes and biometrics
        run: |
          ! find dist -type f -print0 | xargs -0 strings | grep -E 'experimentation/|emotiefflib_repo/|rithvik_disgust'
