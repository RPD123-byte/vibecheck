name: Release macOS preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Vibecheck version to release
        required: true

permissions:
  contents: read

jobs:
  arm64:
    runs-on: macos-14
    environment: macos-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Require an exact matching release version
        run: |
          test "${{ inputs.version }}" = "$(node -p "require('./package.json').version")"
          test "${{ inputs.version }}" = "$(node -p "require('./src/electron/package.json').version")"
          test "${{ inputs.version }}" = "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

      - name: Create ephemeral signing keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/vibecheck-release.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Install notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch the pinned selected model
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/enet_b0_8_best_afew.onnx" \
            "https://raw.githubusercontent.com/sb-ai-lab/EmotiEffLib/main/models/affectnet_emotions/onnx/enet_b0_8_best_afew.onnx"
          echo "7aa2ea31c1311f4f8aa9d3fdb085d418dd4e7a48c4b9ed41df8c044f91d0213f  $RUNNER_TEMP/enet_b0_8_best_afew.onnx" \
            | shasum -a 256 --check

      - name: Build, sign, and notarize application
        env:
          VIBECHECK_MODEL_SOURCE: ${{ runner.temp }}/enet_b0_8_best_afew.onnx
          VIBECHECK_RELEASE_SIGNING: "1"
          VIBECHECK_RELEASE_NOTARIZATION: "1"
          VIBECHECK_DEVELOPER_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm ci
          scripts/build_runtime.sh
          python3 scripts/verify_packaged_control.py
          npm run js:test:e2e
          npm run app:make

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg="$(find src/electron/out/make -name '*.dmg' -type f -print -quit)"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json | tee notarization.json
          test "$(python3 -c 'import json; print(json.load(open("notarization.json"))["status"])')" = "Accepted"
          xcrun stapler staple "$dmg"

      - name: Verify and checksum final artifacts
        run: |
          scripts/inventory_macos_bundle.sh \
            src/electron/out/Vibecheck-darwin-arm64/Vibecheck.app \
            macos-binary-inventory.tsv
          scripts/verify_release.sh src/electron/out
          find src/electron/out/make -type f \( -name '*.dmg' -o -name '*.zip' \) -exec shasum -a 256 {} \; \
            | tee SHA256SUMS
          python3 scripts/release_manifest.py \
            --notarization notarization.json \
            --output RELEASE_MANIFEST.json \
            $(find src/electron/out/make -type f \( -name '*.dmg' -o -name '*.zip' \))

      - uses: actions/upload-artifact@v4
        with:
          name: Vibecheck-${{ inputs.version }}-arm64
          path: |
            src/electron/out/make/**/*.dmg
            src/electron/out/make/**/*.zip
            SHA256SUMS
            RELEASE_MANIFEST.json
            notarization.json
            macos-binary-inventory.tsv
          if-no-files-found: error
